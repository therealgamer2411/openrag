<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRAG Sovereign Grid</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --bg: #0d1117; --primary: #00ff9d; --dev: #58a6ff; --text: #c9d1d9; --panel: #161b22; --cowrie: #f2cc60; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; background: var(--panel); border: 1px solid #30363d; border-radius: 12px; padding: 30px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h1 { text-align: center; color: white; margin-top: 0; font-size: 1.8rem; }
        
        /* شاشة اختيار الدور */
        #role-selector { display: flex; gap: 15px; margin-top: 30px; }
        .role-btn { flex: 1; padding: 20px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .dev-btn { background: #1f6feb; color: white; }
        .dev-btn:hover { background: var(--dev); }
        .worker-btn { background: #238636; color: white; }
        .worker-btn:hover { background: var(--primary); color: black; }

        /* الشاشات الداخلية */
        .dashboard { display: none; }
        .status { text-align: center; font-size: 0.9em; margin-bottom: 20px; color: #8b949e; }
        .status span { font-weight: bold; }
        
        /* البطاقات الاقتصادية (محفظة الكاوري) */
        .wallet-card { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 20px; position: relative; overflow: hidden; }
        .balance { font-size: 3rem; margin: 0; font-weight: bold; }
        .balance.cowries { color: var(--cowrie); text-shadow: 0 0 15px rgba(242, 204, 96, 0.3); }
        .balance.budget { color: var(--dev); }
        
        /* تأثير زيادة الرصيد */
        @keyframes flashGold { 0% { background-color: rgba(242, 204, 96, 0.4); } 100% { background-color: transparent; } }
        .flash { animation: flashGold 1s ease-out; }
        
        /* الأزرار */
        .action-btn { width: 100%; padding: 15px; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-dev { background: var(--dev); color: white; }
        .btn-worker { background: var(--primary); color: black; }
        .action-btn:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
        
        /* شاشة المراقبة (اللوج) */
        .terminal { background: #000; border: 1px solid #30363d; border-radius: 6px; padding: 15px; height: 180px; overflow-y: auto; margin-top: 20px; font-size: 0.85rem; line-height: 1.5; font-family: monospace; }
        .log-success { color: var(--primary); }
        .log-warn { color: var(--cowrie); }
        .log-dev { color: var(--dev); }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌍 OpenRAG Grid</h1>
        
        <div id="role-selector">
            <button class="role-btn dev-btn" onclick="initApp('developer')">👨‍💻 Enter as Initiator</button>
            <button class="role-btn worker-btn" onclick="initApp('worker')">📱 Enter as Compute Node</button>
        </div>

        <div id="dev-dashboard" class="dashboard">
            <div class="status">Role: <span style="color:var(--dev)">Institution / Initiator</span> | Status: <span id="dev-status">Connecting...</span></div>
            <div class="wallet-card">
                <h3 style="margin:0 0 10px 0; color:#8b949e;">Compute Budget (Cowries) 🐚</h3>
                <p class="balance budget" id="dev-balance">5000</p>
            </div>
            <button id="dev-btn" class="action-btn btn-dev" onclick="deployWorkload()" disabled>🚀 Deploy AI Workload (15MB)</button>
            <div class="terminal" id="dev-terminal"></div>
        </div>

        <div id="worker-dashboard" class="dashboard">
            <div class="status">Role: <span style="color:var(--primary)">Edge Compute Node</span> | Status: <span id="worker-status">Connecting...</span></div>
            <div class="wallet-card" id="worker-wallet">
                <h3 style="margin:0 0 10px 0; color:#8b949e;">Cowries Earned 🐚</h3>
                <p class="balance cowries" id="worker-balance">0</p>
            </div>
            <button id="worker-btn" class="action-btn btn-worker" disabled>⏳ Listening for Grid Tasks...</button>
            <div class="terminal" id="worker-terminal"></div>
        </div>
    </div>

    <script>
        const API_KEY = "Africa_Grid_Secret_Key_2026_xyz";
        let socket, peer, iceServers = [];
        let currentRole = "";
        let currentDevBudget = 5000;

        // دوال طباعة الأحداث في الشاشة السوداء
        function logDev(msg, type = '') {
            const term = document.getElementById('dev-terminal');
            term.innerHTML += `<div>> <span class="${type}">${msg}</span></div>`;
            term.scrollTop = term.scrollHeight;
        }
        function logWorker(msg, type = '') {
            const term = document.getElementById('worker-terminal');
            term.innerHTML += `<div>> <span class="${type}">${msg}</span></div>`;
            term.scrollTop = term.scrollHeight;
        }

        // تهيئة التطبيق عند اختيار الدور
        function initApp(role) {
            currentRole = role;
            document.getElementById('role-selector').style.display = 'none';
            document.getElementById(`${role}-dashboard`).style.display = 'block';

            const serverUrl = window.location.origin; // يعمل بذكاء على Localhost أو Render
            
            if(role === 'developer') {
                logDev('Connecting to Federation Core...');
                socket = io(serverUrl, { auth: { token: API_KEY } }); 
            } else {
                logWorker('Connecting to Edge Network...');
                socket = io(serverUrl); 
            }

            // استقبال إعدادات الأنفاق السيادية (TURN)
            socket.on('CONFIG', (data) => {
                iceServers = data.iceServers;
                if(role === 'developer') {
                    document.getElementById('dev-status').innerText = 'Ready 🟢';
                    document.getElementById('dev-btn').disabled = false;
                    logDev('Secure Zero-Trust Tunnel Ready.', 'log-success');
                } else {
                    document.getElementById('worker-status').innerText = 'Ready 🟢';
                    logWorker('Secure TURN credentials loaded.', 'log-success');
                }
            });

            // ==========================================
            // أحداث العُقدة / الهاتف (Worker Logic)
            // ==========================================
            if(role === 'worker') {
                socket.on('connect', () => {
                    const walletId = `Node_${Math.floor(Math.random() * 9999)}`;
                    socket.emit('REGISTER_WORKER', { wallet: walletId });
                    logWorker(`Registered as: ${walletId}`);
                });

                // استقبال الرصيد الافتتاحي وتحديثات الأرباح
                socket.on('BALANCE_UPDATE', (data) => {
                    document.getElementById('worker-balance').innerText = data.balance;
                    if (data.earned) {
                        logWorker(`🎉 Proof of Work Verified! +${data.earned} Cowries 🐚`, 'log-warn');
                        // تفعيل وميض النجاح على المحفظة
                        const walletCard = document.getElementById('worker-wallet');
                        walletCard.classList.remove('flash');
                        void walletCard.offsetWidth; // إعادة ضبط الـ CSS
                        walletCard.classList.add('flash');
                    }
                });

                // استقبال إشارة P2P لفتح النفق والمعالجة
                socket.on('SIGNAL', (data) => {
                    if (!peer) {
                        logWorker('⚡ Incoming Workload Request! Opening Tunnel...', 'log-warn');
                        peer = new SimplePeer({ initiator: false, trickle: true, config: { iceServers, iceTransportPolicy: 'relay' } });
                        
                        peer.on('signal', sig => socket.emit('SIGNAL', { target: data.sender, signal: sig }));
                        
                        peer.on('connect', () => logWorker('🔒 P2P Tunnel Established.', 'log-success'));
                        
                        peer.on('data', msg => {
                            logWorker(`📥 Received Payload: ${msg}`);
                            logWorker('⚙️ Processing AI Data...');
                            document.getElementById('worker-btn').innerText = "⚙️ Computing...";
                            
                            // محاكاة زمن المعالجة (ثانيتين)
                            setTimeout(() => {
                                logWorker('✅ Task complete. Sending result.');
                                peer.send("200_OK_RAG_PROCESSED");
                                
                                // إرسال إثبات العمل للسيرفر لصرف الكاوري (15MB)
                                socket.emit('TASK_COMPLETED', { sizeBytes: 15 * 1024 * 1024 }); 
                                
                                peer.destroy();
                                peer = null;
                                document.getElementById('worker-btn').innerText = "⏳ Listening for Grid Tasks...";
                            }, 2000);
                        });
                    }
                    peer.signal(data.signal);
                });
            }

            // ==========================================
            // أحداث المطور / الجامعة (Developer Logic)
            // ==========================================
            if(role === 'developer') {
                socket.on('NODE_FOUND', ({ targetId }) => {
                    logDev(`Grid matched you with node: ${targetId.substr(0,5)}...`);
                    logDev('Establishing P2P connection...', 'log-dev');
                    
                    peer = new SimplePeer({ initiator: true, trickle: true, config: { iceServers, iceTransportPolicy: 'relay' } });
                    
                    peer.on('signal', sig => socket.emit('SIGNAL', { target: targetId, signal: sig }));
                    
                    peer.on('connect', () => {
                        logDev('🔒 P2P Tunnel Established!', 'log-success');
                        logDev('Uploading 15MB AI Model...');
                        peer.send("[ENCRYPTED_RAG_PAYLOAD]");
                    });
                    
                    peer.on('data', msg => {
                        logDev(`✅ Worker Node Replied: ${msg}`, 'log-success');
                        peer.destroy();
                        peer = null;
                        
                        // إعادة تفعيل زر الإرسال
                        document.getElementById('dev-btn').disabled = false;
                        document.getElementById('dev-btn').innerText = "🚀 Deploy AI Workload (15MB)";
                    });
                });
                
                socket.on('SIGNAL', data => { if(peer) peer.signal(data.signal); });
                socket.on('ERROR', err => {
                    logDev(`❌ Error: ${err.msg}`, '');
                    document.getElementById('dev-btn').disabled = false;
                    document.getElementById('dev-btn').innerText = "🚀 Deploy AI Workload (15MB)";
                });
            }
        }

        // دالة زر إطلاق المهمة (خاصة بالمطور)
        function deployWorkload() {
            document.getElementById('dev-btn').disabled = true;
            document.getElementById('dev-btn').innerText = "Searching Grid...";
            logDev('Emitting FIND_NODE broadcast...');
            
            // خصم الكاوري من ميزانية المطور محلياً لإثبات التبادل في الـ Demo
            currentDevBudget -= 15;
            document.getElementById('dev-balance').innerText = currentDevBudget;
            logDev(`➖ 15 Cowries allocated for compute.`, 'log-dev');
            
            socket.emit('FIND_NODE');
        }
    </script>
</body>
</html>
